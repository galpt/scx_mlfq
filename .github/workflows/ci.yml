name: ci

# Overlay CI for the scx_mlfq scheduler.
#
# The scheduler in scx/ replaces scheds/experimental/scx_mlfq/ in an
# upstream sched-ext/scx checkout (path deps use ../../../rust), so every
# job first assembles that workspace, syncs the lock entry of the
# scheduler and then runs the usual package checks inside it. The
# scheduler is never loaded here: the jobs run the unit tests, a
# --version smoke check and the BPF verifier through veristat.

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail -x {0}

env:
  PS4: '+ $(date "+%H:%M:%S") '
  BPF_CLANG: clang-19
  RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # sched-ext/scx main with scx_flow 5.2.27 merged. scx/ builds against the
  # scx_* crates and BPF headers of this workspace, so bump it only after
  # checking that the scheduler still builds on the new ref.
  SCX_REF: 48e2a9cbd36b29a2a52689112fb613bae9723b8f

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev mold
          echo /usr/lib/llvm-19/bin >> $GITHUB_PATH
      - name: Assemble the scheduler workspace
        run: |
          git init -q /tmp/scx
          git -C /tmp/scx remote add origin https://github.com/sched-ext/scx
          git -C /tmp/scx fetch --depth 1 origin "${SCX_REF}"
          git -C /tmp/scx checkout FETCH_HEAD
          # Upstream already ships scheds/experimental/scx_mlfq, so replace
          # it instead of merging into it.
          rsync -a --delete --exclude /target/ scx/ /tmp/scx/scheds/experimental/scx_mlfq/
          rm -f /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          ln -s ../../../LICENSE /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          grep -q '"scheds/experimental/scx_mlfq"' /tmp/scx/Cargo.toml
      - name: Sync the lock entry of the scheduler
        working-directory: /tmp/scx
        run: cargo update -p scx_mlfq
      - name: Format
        working-directory: /tmp/scx
        run: cargo fmt -p scx_mlfq --check
      - name: Clippy
        working-directory: /tmp/scx
        run: cargo clippy --profile ci --no-deps --locked -p scx_mlfq -- -Dwarnings
      - name: Build
        working-directory: /tmp/scx
        run: cargo build --profile ci --locked -p scx_mlfq
      - name: Unit tests
        working-directory: /tmp/scx
        run: cargo test --profile ci --locked -p scx_mlfq
      - name: Smoke test (no kernel needed)
        working-directory: /tmp/scx
        run: |
          target/ci/scx_mlfq --version
          target/ci/scx_mlfq --help > /dev/null

  veristat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev mold
          echo /usr/lib/llvm-19/bin >> $GITHUB_PATH
      - name: Assemble the scheduler workspace
        run: |
          git init -q /tmp/scx
          git -C /tmp/scx remote add origin https://github.com/sched-ext/scx
          git -C /tmp/scx fetch --depth 1 origin "${SCX_REF}"
          git -C /tmp/scx checkout FETCH_HEAD
          # Upstream already ships scheds/experimental/scx_mlfq, so replace
          # it instead of merging into it.
          rsync -a --delete --exclude /target/ scx/ /tmp/scx/scheds/experimental/scx_mlfq/
          rm -f /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          ln -s ../../../LICENSE /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          grep -q '"scheds/experimental/scx_mlfq"' /tmp/scx/Cargo.toml
      - name: Sync the lock entry of the scheduler
        working-directory: /tmp/scx
        run: cargo update -p scx_mlfq
      - name: Install veristat tools
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/libbpf/veristat /tmp/veristat
          make -C /tmp/veristat/src -j$(nproc)
          sudo cp /tmp/veristat/src/veristat /usr/local/bin/
          sudo setcap cap_bpf,cap_perfmon+ep /usr/local/bin/veristat
          cargo install cargo-veristat --locked
      - name: Build and verify
        working-directory: /tmp/scx
        run: |
          cargo build --profile ci --locked -p scx_mlfq
          cargo metadata --format-version 1 > /tmp/meta.json
          cargo veristat --profile ci --metadata-json /tmp/meta.json \
            --no-build scx_mlfq
