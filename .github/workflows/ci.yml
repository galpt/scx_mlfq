name: ci

on:
  workflow_dispatch:

env:
  BPF_CLANG: clang-19

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev stress-ng mold
      - name: Assemble the scheduler workspace
        run: |
          git clone --depth 1 https://github.com/sched-ext/scx /tmp/scx
          cp -r scx /tmp/scx/scheds/experimental/scx_mlfq
          rm /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          ln -s ../../../LICENSE /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          python3 - <<'EOF'
          p = '/tmp/scx/Cargo.toml'
          s = open(p).read()
          marker = '    "scheds/experimental/scx_rlfifo",'
          assert marker in s, "workspace member marker not found"
          s = s.replace(marker,
                        '    "scheds/experimental/scx_mlfq",\n' + marker)
          open(p, 'w').write(s)
          EOF
      - name: Build
        working-directory: /tmp/scx
        run: cargo build --profile ci -p scx_mlfq
      - name: Format
        working-directory: /tmp/scx
        run: cargo fmt -p scx_mlfq --check
      - name: Clippy
        working-directory: /tmp/scx
        run: cargo clippy --profile ci --no-deps --locked -p scx_mlfq -- -D warnings
      - name: Unit tests
        working-directory: /tmp/scx
        run: cargo test --profile ci --locked -p scx_mlfq
      - name: Kernel diagnostics
        run: |
          uname -r
          cat /proc/sys/kernel/sched_ext/state 2>/dev/null || true
          zcat /proc/config.gz 2>/dev/null | grep -E "CONFIG_(PREEMPT|HZ_|NO_HZ|SCHED_CLASS_EXT|SCHED_SMT|SCHED_AUTOGROUP)" || true
      - name: Stress test (no affinity)
        working-directory: /tmp/scx
        run: |
          stress-ng -t 31 --aggressive -M -c 4 -f 4 &
          stress_pid=$!
          set +e
          sudo timeout --foreground --preserve-status 45 \
            target/ci/scx_mlfq -v
          rc=$?
          set -e
          kill $stress_pid 2>/dev/null || true
          wait $stress_pid 2>/dev/null || true
          exit $rc
      - name: Stress test (affinity only)
        working-directory: /tmp/scx
        run: |
          stress-ng -t 31 --aggressive -M --affinity 1 --affinity-delay 1 \
            --affinity-pin &
          stress_pid=$!
          set +e
          sudo timeout --foreground --preserve-status 45 \
            target/ci/scx_mlfq -v
          rc=$?
          set -e
          kill $stress_pid 2>/dev/null || true
          wait $stress_pid 2>/dev/null || true
          exit $rc

  veristat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config lld clang clang-19 llvm-19 \
            libbpf-dev libelf-dev libzstd-dev protobuf-compiler \
            libseccomp-dev libcap-ng-dev mold
      - name: Assemble the scheduler workspace
        run: |
          git clone --depth 1 https://github.com/sched-ext/scx /tmp/scx
          cp -r scx /tmp/scx/scheds/experimental/scx_mlfq
          rm /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          ln -s ../../../LICENSE /tmp/scx/scheds/experimental/scx_mlfq/LICENSE
          python3 - <<'EOF'
          p = '/tmp/scx/Cargo.toml'
          s = open(p).read()
          marker = '    "scheds/experimental/scx_rlfifo",'
          assert marker in s, "workspace member marker not found"
          s = s.replace(marker,
                        '    "scheds/experimental/scx_mlfq",\n' + marker)
          open(p, 'w').write(s)
          EOF
      - name: Install veristat tools
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/libbpf/veristat /tmp/veristat
          make -C /tmp/veristat/src -j$(nproc)
          sudo cp /tmp/veristat/src/veristat /usr/local/bin/
          sudo setcap cap_bpf,cap_perfmon+ep /usr/local/bin/veristat
          cargo install cargo-veristat --locked
      - name: Build and verify
        working-directory: /tmp/scx
        run: |
          cargo build --profile ci -p scx_mlfq
          cargo metadata --format-version 1 > /tmp/meta.json
          cargo veristat --profile ci --metadata-json /tmp/meta.json \
            --no-build scx_mlfq
